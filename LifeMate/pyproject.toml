[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lifemate"
version = "0.1.0"
description = "Offline, split-aware LifeMate execution and train evaluation"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.10,<3", "tzdata>=2024.1"]

[project.optional-dependencies]
model = ["torch>=2.2,<3", "transformers==4.56.2", "accelerate>=1.4,<2", "peft==0.17.1"]
ollama = ["tokenizers>=0.22,<0.23"]
asr = ["torch>=2.2,<3", "transformers==4.56.2", "accelerate>=1.4,<2", "soundfile>=0.12,<0.14", "scipy>=1.11,<2"]
training = ["torch>=2.2,<3", "transformers==4.56.2", "accelerate>=1.4,<2", "peft==0.17.1", "trl==0.23.1", "datasets>=3,<4"]
dev = ["ruff>=0.9,<1", "mypy>=1.14,<2", "build>=1.2,<2", "setuptools>=68", "wheel>=0.45,<1"]

[project.scripts]
lifemate = "lifemate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.package-data]
lifemate = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
no_implicit_optional = true
